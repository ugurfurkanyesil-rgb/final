kind = "web"
previewPath = "/"
title = "Moon Rover Simulation"
version = "1.0.0"
id = "artifacts/moon-rover"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25778

[services.development]
run = "pnpm --filter @workspace/moon-rover run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moon-rover", "run", "build" ]
publicDir = "artifacts/moon-rover/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25778"
BASE_PATH = "/"
